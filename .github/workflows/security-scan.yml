name: Security scan (reusable)

# Builds a project's image and reports fixable HIGH/CRITICAL findings with
# Trivy: a table in the log and a SARIF artifact (trivy-report). Report only:
# the release workflow is the gate. The caller owns its schedule and PR paths:
#
#   on:
#     schedule: [{ cron: "0 5 * * 1" }]   # Monday 05:00 UTC
#     pull_request: { paths: [Dockerfile, "requirements*.txt"] }
#   jobs:
#     trivy:
#       permissions: { contents: read }
#       uses: Napandee/standard-workflows/.github/workflows/security-scan.yml@v1
on:
  workflow_call:
    inputs:
      context:
        type: string
        default: .
      file:
        type: string
        default: Dockerfile
      build-args:
        description: Newline-separated KEY=value build args
        type: string
        default: ""
      runner:
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (load for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          load: true
          push: false
          tags: image:scan
          build-args: ${{ inputs.build-args }}

      - name: Trivy scan (table, report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: image:scan
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Trivy scan (SARIF, report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: image:scan
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-setup-trivy: true

      - name: Upload trivy-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30
