name: Demo kit CI

# Tests the demo kit (demo-kit/), the release version script and the change
# filter (scripts/changes.py, changes.yml) on GitHub's hosted runners. The kit
# is shared by every project's demo, so it is tested here before the v1 tag
# can move.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kit-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  demo-kit:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: demo-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: node --test 'test/*.test.mjs'

  next-version:
    runs-on: ubuntu-latest
    container: python:3.14-slim
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install --no-cache-dir pytest==8.4.2
      - run: python -m pytest -q test_next_version.py

  changes-script:
    runs-on: ubuntu-latest
    container: python:3.14-slim
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests build throwaway git repos, so they need git.
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git
      - run: pip install --no-cache-dir pytest==8.4.2
      - run: python -m pytest -q test_changes.py
      - run: python -m pytest -q test_wiki_build.py

  # The reusable change filter end to end on this repo, with the script from
  # this same commit. The check job works out on its own what each flag must
  # be: on main every group is true; on a pull request the flags follow
  # `git diff --name-only HEAD^1 HEAD` (all true when kit-ci.yml, the caller,
  # changed), and `all` matches every file, so an all-false filter fails.
  changes-selftest:
    permissions:
      contents: read
    uses: ./.github/workflows/changes.yml
    with:
      groups: |
        # a comment line
        workflows: .github/workflows
        scripts: 'scripts/*.py'
        license: LICENSE
        all: .
      kit-ref: ${{ github.sha }}

  changes-outputs:
    needs: changes-selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Flags match what this change touched
        env:
          FLAGS: ${{ needs.changes-selftest.outputs.groups }}
          CODE: ${{ needs.changes-selftest.outputs.code }}
          SCRIPTS: ${{ fromJSON(needs.changes-selftest.outputs.groups).scripts }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "groups=$FLAGS code=$CODE scripts=$SCRIPTS"
          echo "$FLAGS" | jq -e 'keys == ["all", "license", "scripts", "workflows"]'
          echo "$FLAGS" | jq -e 'map_values(type == "boolean") | all'
          [ "$SCRIPTS" = "$(echo "$FLAGS" | jq -r .scripts)" ] || { echo "::error::fromJSON read '$SCRIPTS'"; exit 1; }
          has() { if printf '%s\n' "$changed" | grep -Eq "$1"; then echo true; else echo false; fi; }
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            printf 'changed:\n%s\n' "$changed"
          fi
          if [ "$EVENT" != pull_request ] || [ "$(has '^\.github/workflows/kit-ci\.yml$')" = true ]; then
            want='{"all":true,"license":true,"scripts":true,"workflows":true}'; want_code=true
          else
            want=$(jq -cn --argjson a "$(has .)" --argjson l "$(has '^LICENSE$')" \
              --argjson s "$(has '^scripts/.*\.py$')" --argjson w "$(has '^\.github/workflows/')" \
              '{all: $a, license: $l, scripts: $s, workflows: $w}')
            want_code=$(printf '%s\n' "$changed" | grep -Ev '^docs/|\.md$' | grep -q . && echo true || echo false)
          fi
          echo "want=$want code=$want_code"
          echo "$FLAGS" | jq -e --argjson want "$want" '. == $want'
          [ "$CODE" = "$want_code" ] || { echo "::error::code is '$CODE', want '$want_code'"; exit 1; }

  # This repo is public and generic. Private homelab detail belongs in the
  # private Napandee/actions repo, never here (README "What belongs where").
  no-private-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse homelab-specific names and addresses
        run: |
          pattern='brantholms|\.cluster\.local|192\.168\.|k3s-0[0-9]|runs-on: k3s|buildkitd|/mnt/build|unraid'
          if git grep -nIiE "$pattern" -- . ':!README.md' ':!.github/workflows/kit-ci.yml'; then
            echo "::error::homelab-specific detail found; it belongs in the private Napandee/actions repo"
            exit 1
          fi
