name: Changes (reusable)

# Says which named path groups a change touches, so a project runs its slow
# jobs only when they are needed. The logic is scripts/changes.py (tested in
# kit-ci); this workflow only checks out and runs it. The caller reads the
# flags from JSON, because a reusable workflow's outputs are fixed:
#
#   jobs:
#     changes:
#       permissions: { contents: read }
#       uses: Napandee/standard-workflows/.github/workflows/changes.yml@v1
#       with:
#         groups: |
#           ui: web scripts/check_*.mjs
#     ui-checks:
#       needs: changes
#       if: fromJSON(needs.changes.outputs.groups).ui
on:
  workflow_call:
    inputs:
      groups:
        description: "One group per line, 'name: pattern pattern ...' (git pathspecs)"
        type: string
        default: ""
      ignore-versions:
        description: A diff that only moves version numbers (1.2.3, 1.2.3-rc.1) counts as no change
        type: boolean
        default: true
      workflow-path:
        description: "The caller's workflow file; when it changes, every group is true. Empty: taken from github.workflow_ref. '-': off"
        type: string
        default: ""
      runner:
        type: string
        default: ubuntu-latest
      kit-ref:
        description: "Ref of Napandee/standard-workflows the script is checked out at; must match the ref this workflow is called at"
        type: string
        default: v1
    outputs:
      groups:
        description: 'JSON object, group name -> true/false: fromJSON(needs.<job>.outputs.groups).<name>'
        value: ${{ jobs.changes.outputs.groups }}
      code:
        description: "'true' when anything outside docs/ and *.md changed"
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.paths.outputs.groups }}
      code: ${{ steps.paths.outputs.code }}
    steps:
      # Depth 2: a pull request's merge checkout and its first parent (the
      # base branch). Credentials stay for the one shallow fetch of the commit
      # before a push, which a private repo needs; nothing but git and the
      # script below runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check out the script (inputs.kit-ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Napandee/standard-workflows
          ref: ${{ inputs.kit-ref }}
          path: .standard-kit
          sparse-checkout: scripts
          persist-credentials: false

      - name: Decide which groups changed
        id: paths
        env:
          GROUP_LINES: ${{ inputs.groups }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before || github.event.merge_group.base_sha }}
          IGNORE_VERSIONS: ${{ inputs.ignore-versions }}
          WORKFLOW_PATH: ${{ inputs.workflow-path }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          python3 .standard-kit/scripts/changes.py
          --groups="$GROUP_LINES" --event="$EVENT" --before="$BEFORE"
          --ignore-versions="$IGNORE_VERSIONS"
          --workflow-path="$WORKFLOW_PATH" --workflow-ref="$WORKFLOW_REF"
          --repository="$REPOSITORY" --output="$GITHUB_OUTPUT"
